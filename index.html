<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUKAKI - University of Eldoret</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237A1E2E'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>B</text></svg>">
<meta name="theme-color" content="#7A1E2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --burgundy:#7A1E2E;--burgundy-dark:#5C1622;--burgundy-light:#9B2A3E;
  --cream:#FBF7F4;--card:#fff;--border:#EDE5E0;
  --text:#2C1810;--muted:#8B7B7B;--rose:#F5E4E6;--rose-text:#7A1E2E;
  --gold:#C9A227;
}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--cream);color:var(--text);line-height:1.5;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--burgundy-dark);color:#fff;z-index:100;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto}
.sidebar.open{transform:translateX(0)}
.sb-brand{padding:20px 20px 24px;display:flex;align-items:center;gap:12px}
.sb-logo{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex-shrink:0}
.sb-logo svg{width:24px;height:24px;color:var(--burgundy-dark)}
.sb-brand-txt{line-height:1.2}
.sb-brand-txt b{font-size:18px;font-weight:700;display:block}
.sb-brand-txt span{font-size:12px;opacity:.7}
.sb-menu{flex:1;padding:0 12px}
.sb-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:10px;color:rgba(255,255,255,.85);font-size:15px;cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:inherit;margin-bottom:2px}
.sb-item:hover{background:rgba(255,255,255,.06)}
.sb-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.sb-item svg{width:20px;height:20px;flex-shrink:0;opacity:.85}
.sb-item.active svg{opacity:1}
.sb-divider{height:1px;background:rgba(255,255,255,.1);margin:16px 14px}
.sb-footer{padding:16px 12px 24px}
.sb-signout{color:rgba(255,255,255,.85);display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:10px;font-size:15px;cursor:pointer;background:none;border:none;width:100%;font-family:inherit;text-align:left}
.sb-signout:hover{background:rgba(255,255,255,.06)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.main{flex:1;min-width:0;width:100%;display:flex;flex-direction:column}
.topbar-wrap{position:sticky;top:0;z-index:50;background:var(--cream);border-bottom:1px solid var(--border)}
.topbar-brand{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600;padding:8px 0 2px;background:var(--cream)}
.topbar{padding:14px 16px;display:flex;align-items:center;gap:12px}
.topbar-btn{background:none;border:none;padding:8px;cursor:pointer;color:var(--text);display:grid;place-items:center;border-radius:8px}
.topbar-btn:hover{background:rgba(0,0,0,.04)}
.topbar-btn svg{width:22px;height:22px}
.topbar-title{flex:1;text-align:center;font-size:20px;font-weight:600;color:var(--text)}
.topbar-actions{display:flex;gap:4px;align-items:center}
.content{padding:20px 16px 40px;max-width:900px;margin:0 auto;width:100%}
.hero{background:linear-gradient(135deg,var(--burgundy) 0%,var(--burgundy-dark) 100%);border-radius:20px;padding:28px 24px;color:#fff;margin-bottom:20px;box-shadow:0 8px 20px rgba(122,30,46,.2)}
.hero-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.75;font-weight:600;margin-bottom:12px}
.hero h1{font-size:28px;font-weight:700;line-height:1.2;margin-bottom:10px;letter-spacing:-.02em}
.hero p{font-size:15px;opacity:.85;line-height:1.5;margin-bottom:20px}
.hero-actions{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hero-btn{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
.hero-btn:hover{background:rgba(255,255,255,.22)}
.hero-btn.solid{background:#fff;color:var(--burgundy);border-color:#fff;font-weight:600}
.hero-btn.solid:hover{background:#f5f5f5}
.hero-btn svg{width:18px;height:18px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:#fff;border-radius:16px;padding:18px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-label{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px}
.stat-value{font-size:28px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:600;color:var(--text)}
.card-h a{color:var(--burgundy);font-size:14px;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:4px;cursor:pointer}
.event-row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.event-row:last-child{border-bottom:none;padding-bottom:0}
.event-row:first-child{padding-top:0}
.date-pill{width:56px;flex-shrink:0;background:var(--rose);border-radius:12px;padding:10px 6px;text-align:center;color:var(--burgundy)}
.date-pill .d-month{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.date-pill .d-day{font-size:18px;font-weight:700;line-height:1}
.event-info{flex:1;min-width:0}
.event-info h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.event-info p{font-size:13px;color:var(--muted)}
.chip{display:inline-block;background:var(--rose);color:var(--rose-text);font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px}
.chip.pinned{text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:#F0EBE7;color:var(--muted)}
.badge.active{background:#DCFCE7;color:#166534}
.badge.warned{background:#FEF3C7;color:#78350F}
.badge.revoked{background:#FEE2E2;color:#991B1B}
.badge.reinstated{background:#DBEAFE;color:#1E40AF}
.badge.super{background:var(--gold);color:#fff}
.badge.exec{background:var(--rose);color:var(--burgundy)}
.ann-item{padding:16px 0;border-bottom:1px solid var(--border)}
.ann-item:last-child{border-bottom:none;padding-bottom:0}
.ann-item:first-child{padding-top:0}
.ann-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.ann-h h3{font-size:15px;font-weight:600;color:var(--text);flex:1}
.ann-item p{font-size:13px;color:var(--muted);line-height:1.5}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--burgundy);box-shadow:0 0 0 3px rgba(122,30,46,.08)}
textarea{resize:vertical;min-height:80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--burgundy);color:#fff}
.btn-primary:hover{background:var(--burgundy-dark)}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:#FAF6F3}
.btn-danger{background:#FEE2E2;color:#991B1B}
.btn-danger:hover{background:#FECACA}
.btn-success{background:#16A34A;color:#fff}
.btn-success:hover{background:#15803D}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-sm svg{width:14px;height:14px}
.btn-block{width:100%}
.leader-row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);align-items:center}
.leader-row:last-child{border-bottom:none;padding-bottom:0}
.leader-row:first-child{padding-top:0}
.leader-avatar{width:48px;height:48px;border-radius:50%;background:var(--rose);color:var(--burgundy);display:grid;place-items:center;flex-shrink:0}
.leader-avatar svg{width:22px;height:22px}
.leader-info h3{font-size:15px;font-weight:600;color:var(--text)}
.leader-info p{font-size:13px;color:var(--muted);margin-top:2px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.mb{margin-bottom:16px}
.mt{margin-top:16px}
.right{text-align:right}
.hidden{display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;color:#fff;font-size:14px;font-weight:500;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.success{background:var(--burgundy)}
.toast.error{background:#DC2626}
.access-card{background:#FDF6E3;border:1px solid #F5E6C0;border-radius:16px;padding:20px;display:flex;gap:14px;align-items:center}
.access-card .check{width:44px;height:44px;border-radius:50%;background:var(--rose);color:var(--burgundy);display:grid;place-items:center;flex-shrink:0}
.access-card .check svg{width:20px;height:20px}
.access-card h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:2px}
.access-card p{font-size:13px;color:var(--muted)}
.prayer-item{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.prayer-item h3{font-size:14px;font-weight:600;margin-bottom:4px}
.prayer-item p{font-size:13px;color:var(--muted);margin-bottom:10px}
.prayer-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.member-row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap}
.member-row:last-child{border-bottom:none;padding-bottom:0}
.member-row:first-child{padding-top:0}
.member-avatar{width:44px;height:44px;border-radius:50%;background:var(--rose);color:var(--burgundy);display:grid;place-items:center;font-weight:600;flex-shrink:0;font-size:15px}
.member-info{flex:1;min-width:0}
.member-info h3{font-size:14px;font-weight:600;margin-bottom:2px}
.member-info p{font-size:12px;color:var(--muted)}
.member-actions{display:flex;gap:6px;flex-wrap:wrap}
.family-chip{display:inline-flex;align-items:center;gap:6px;background:var(--rose);color:var(--burgundy);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
.edit-form{background:#FAF6F3;border:1px solid var(--border);border-radius:14px;padding:16px;margin:8px 0}
.edit-form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.edit-form .grid2{grid-template-columns:1fr}}
.role-select{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;width:100%}
.assign-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.assign-row:last-child{border-bottom:none}
@media(max-width:600px){.assign-row{grid-template-columns:1fr;gap:8px}}
.assign-label{font-size:14px;font-weight:600;color:var(--text)}
.assign-sub{font-size:12px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M7 7h10"/></svg></div>
      <div class="sb-brand-txt"><b>BUKAKI</b><span>University of Eldoret</span></div>

        Sign out

  <div class="main">
    <div class="topbar-wrap">

      <div class="topbar">
        <button class="topbar-btn" onclick="toggleSidebar()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="topbar-title" id="pageTitle">Dashboard</div>
        <div class="topbar-actions"><button class="topbar-btn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg></button></div>

    </div>
    <main class="content" id="app"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

function sem(){var d=new Date();return d.getFullYear()+'/S'+((d.getMonth()>=8||d.getMonth()<=1)?1:2);}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,10);}
function fmtKES(n){return 'Ksh '+Number(n).toLocaleString('en-KE');}
function fmtDate(s){var d=new Date(s);return d.toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function fmtDT(s){var d=new Date(s);return d.toLocaleString('en-KE',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function normPhone(p){var s=String(p).replace(/[^0-9]/g,'');if(s.indexOf('254')===0)return s;if(s.indexOf('0')===0)return'254'+s.slice(1);if(s.length===9)return'254'+s;return s;}
function toLocalInput(iso){var d=new Date(iso),pad=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function datePill(s){var d=new Date(s);var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return '<div class="date-pill"><div class="d-month">'+months[d.getMonth()]+'</div><div class="d-day">'+String(d.getDate()).padStart(2,'0')+'</div></div>';}
function initials(name){return String(name||'?').split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();}
function catLabel(c){return CAT_LABELS[c]||c.replace(/_/g,' ');}

function loadDB(){
  try{
    var raw = localStorage.getItem(DB_KEY);
    if(!raw){var f=seedDB();localStorage.setItem(DB_KEY,JSON.stringify(f));return f;}
    var db = JSON.parse(raw);
    if(!db.announcements)db.announcements=[];
    if(!db.prayerIntentions)db.prayerIntentions=[];
    if(!db.attendance)db.attendance=[];
    var idx=-1;
    for(var i=0;i<db.members.length;i++){if(db.members[i].is_super_admin||db.members[i].phone===SUPER_ADMIN_PHONE){idx=i;break;}}
    if(idx===-1)db.members.unshift(seedDB().members[0]);
    else{db.members[idx].is_super_admin=true;db.members[idx].phone=SUPER_ADMIN_PHONE;}
    return db;
  }catch(e){return seedDB();}
}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch(e){}}
var DB = loadDB();
function isSA(m){return !!(m && (m.is_super_admin || m.phone === SUPER_ADMIN_PHONE));}
function isAdmin(m){return isSA(m) || (m && ADMIN_ROLES.indexOf(m.role)!==-1);}
function isFinance(m){return isSA(m) || (m && FINANCE_ROLES.indexOf(m.role)!==-1);}
function me(){for(var i=0;i<DB.members.length;i++){if(DB.members[i].id===DB.currentUserId)return DB.members[i];}return null;}
function memberById(id){for(var i=0;i<DB.members.length;i++){if(DB.members[i].id===id)return DB.members[i];}return null;}
function familyName(id){for(var i=0;i<DB.families.length;i++){if(DB.families[i].id===id)return DB.families[i].name;}return '';}
function toast(msg,kind){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+(kind||'success');
  clearTimeout(t._tid);
  t._tid=setTimeout(function(){t.className='toast';},2800);
}

var EDITING_MEMBER_ID = null;
function startEditMember(id){ EDITING_MEMBER_ID = id; render(); }
function cancelEditMember(){ EDITING_MEMBER_ID = null; render(); }
function saveEditedMember(e){
  e.preventDefault();
  var id = EDITING_MEMBER_ID;
  var m = memberById(id);
  if(!m) return;
  var newPhone = normPhone(document.getElementById('em_phone').value);
  for(var i=0;i<DB.members.length;i++){
    if(DB.members[i].id!==id && DB.members[i].phone===newPhone){
      toast('Phone already used by another member.','error');
      return;
    }
  }
  m.full_name = document.getElementById('em_name').value.trim() || m.full_name;
  m.phone = newPhone;
  m.reg_number = document.getElementById('em_reg').value.trim() || null;
  m.email = document.getElementById('em_email').value.trim() || null;
  m.year_of_study = Number(document.getElementById('em_year').value);
  m.course = document.getElementById('em_course').value.trim() || null;
  m.diocese = document.getElementById('em_diocese').value;
  m.family_id = document.getElementById('em_family').value;
  m.is_catholic = document.getElementById('em_catholic').checked;
  if(isSA(m)){
    m.is_super_admin = true;
    m.phone = SUPER_ADMIN_PHONE;
  } else {
    m.role = document.getElementById('em_role').value;
    m.status = document.getElementById('em_status').value;
  }
  saveDB();
  toast(m.full_name + ' updated.');
  EDITING_MEMBER_ID = null;
  render();
}
function assignLeadership(role, memberId){
  for(var i=0;i<DB.members.length;i++){
    if(DB.members[i].role===role && DB.members[i].id!==memberId && !isSA(DB.members[i])){
      DB.members[i].role = 'member';
    }
  }
  if(memberId){
    var nm = memberById(memberId);
    if(nm && !isSA(nm)) nm.role = role;
  }
  saveDB();
  toast(ROLES[role] + ' updated.');
  render();
}
function doLogin(){
  var phone = normPhone(document.getElementById('loginPhone').value);
  var found = null;
  for(var i=0;i<DB.members.length;i++){if(DB.members[i].phone===phone){found=DB.members[i];break;}}
  if(!found){toast('No member found.','error');return;}
  DB.currentUserId = found.id;
  saveDB();
  toast(isSA(found)?'★ Karibu Super Admin':'Karibu '+found.full_name);
  go('dashboard');
}
function logout(){ DB.currentUserId=null; saveDB(); toast('Signed out.'); go('dashboard'); }
function affirmOath(){ var m=me(); if(!m) return; m.oath_accepted_at=new Date().toISOString(); saveDB(); toast('Oath affirmed.'); render(); }
function createEvent(e){
  e.preventDefault();
  var title = document.getElementById('evTitle').value.trim();
  var cat = document.getElementById('evCat').value;
  var dt = document.getElementById('evTime').value;
  var loc = document.getElementById('evLoc').value.trim();
  var desc = document.getElementById('evDesc').value.trim();
  if(!title||!dt){toast('Title and time required.','error');return;}
  DB.events.push({id:uid('e'),title:title,description:desc||null,category:cat,starts_at:new Date(dt).toISOString(),location:loc||null,semester:sem(),created_by:DB.currentUserId});
  saveDB(); toast('Event published.'); render();
}
function deleteEvent(id){
  if(!confirm('Delete this event?')) return;
  DB.events = DB.events.filter(function(x){return x.id!==id;});
  saveDB(); toast('Event deleted.'); render();
}
function createAnnouncement(e){
  e.preventDefault();
  var title = document.getElementById('anTitle').value.trim();
  var body = document.getElementById('anBody').value.trim();
  var pinned = document.getElementById('anPinned').checked;
  if(!title||!body){toast('Title and body required.','error');return;}
  DB.announcements.unshift({id:uid('a'),title:title,body:body,pinned:pinned,created_at:new Date().toISOString(),created_by:DB.currentUserId});
  saveDB(); toast('Announcement published.'); render();
}
function deleteAnnouncement(id){
  if(!confirm('Delete this announcement?')) return;
  DB.announcements = DB.announcements.filter(function(x){return x.id!==id;});
  saveDB(); toast('Deleted.'); render();
}
function addMember(e){
  e.preventDefault();
  var f = {
    id:uid('m'),
    full_name:document.getElementById('mName').value.trim(),
    phone:normPhone(document.getElementById('mPhone').value),
    reg_number:document.getElementById('mReg').value.trim()||null,
    email:document.getElementById('mEmail').value.trim()||null,
    year_of_study:Number(document.getElementById('mYear').value),
    course:document.getElementById('mCourse').value.trim()||null,
    diocese:document.getElementById('mDiocese').value,
    is_catholic:document.getElementById('mCatholic').checked,
    family_id:document.getElementById('mFamily').value,
    role:document.getElementById('mRole').value,
    status:'active',
    joined_at:new Date().toISOString(),
    semester_joined:sem(),
    membership_years:0,
    oath_accepted_at:null
  };
  if(!f.full_name||!f.phone){toast('Name and phone required.','error');return;}
  for(var i=0;i<DB.members.length;i++){if(DB.members[i].phone===f.phone){toast('Phone already in use.','error');return;}}
  DB.members.push(f);
  saveDB(); toast(f.full_name+' added.'); render();
}
function deleteMember(id){
  var m = memberById(id);
  if(!m) return;
  if(isSA(m)){toast('Cannot delete Super Admin.','error');return;}
  if(!confirm('Delete '+m.full_name+'?')) return;
  DB.members = DB.members.filter(function(x){return x.id!==id;});
  saveDB(); toast('Deleted.'); render();
}
function submitPrayer(e){
  e.preventDefault();
  var m = me(); if(!m) return;
  var text = document.getElementById('prText').value.trim();
  if(!text){toast('Type an intention.','error');return;}
  DB.prayerIntentions.unshift({id:uid('pr'),text:text,member_id:m.id,created_at:new Date().toISOString(),pray_count:0});
  saveDB(); toast('Prayer intention submitted.'); render();
}
function prayFor(id){
  for(var i=0;i<DB.prayerIntentions.length;i++){
    if(DB.prayerIntentions[i].id===id){DB.prayerIntentions[i].pray_count++;break;}
  }
  saveDB(); toast('🙏 Praying with you.'); render();
}
function deletePrayer(id){
  if(!confirm('Delete this intention?')) return;
  DB.prayerIntentions = DB.prayerIntentions.filter(function(x){return x.id!==id;});
  saveDB(); render();
}
function toggleAttendance(eventId, memberId){
  var found = false;
  for(var i=0;i<DB.attendance.length;i++){
    if(DB.attendance[i].event_id===eventId && DB.attendance[i].member_id===memberId){
      DB.attendance[i].present = !DB.attendance[i].present;
      found = true; break;
    }
  }
  if(!found) DB.attendance.push({id:uid('at'),event_id:eventId,member_id:memberId,present:true,marked_at:new Date().toISOString()});
  saveDB(); render();
}

  if(!confirm('Reset EVERYTHING to factory state?')) return;

function copyBackup(){
  var json = JSON.stringify(DB,null,2);
  if(navigator.clipboard){
    navigator.clipboard.writeText(json).then(function(){toast('Copied.');},function(){prompt('Copy:',json);});
  } else {prompt('Copy:',json);}
}
function castVote(elId,candId){
  var u = me(); if(!u) return;
  for(var i=0;i<DB.votes.length;i++){if(DB.votes[i].election_id===elId && DB.votes[i].voter_id===u.id){toast('Already voted.','error');return;}}
  DB.votes.push({id:uid('v'),election_id:elId,voter_id:u.id,candidate_id:candId,cast_at:new Date().toISOString()});
  for(var j=0;j<DB.candidacies.length;j++){
    if(DB.candidacies[j].election_id===elId && DB.candidacies[j].member_id===candId){DB.candidacies[j].votes++;}
  }
  saveDB(); toast('Vote recorded.'); render();
}

        var mem = DB.members[mi2];
        if(isSA(mem)) continue;
        if(mem.status!=='active' && mem.status!=='reinstated') continue;
        h += '<option value="'+mem.id+'"'+(holder && holder.id===mem.id?' selected':'')+'>'+esc(mem.full_name)+' ('+esc(mem.phone)+')</option>';
      }
      h += '</select></div>';
    }
    h += '</div>';
  }
  if(tab==='create'){
    h += '<div class="card"><div class="card-h"><h2>Create event</h2></div>';
    h += '<form onsubmit="createEvent(event)">';
    h += '<label class="field"><span>Event title</span><input id="evTitle" required></label>';
    h += '<label class="field"><span>Category</span><select id="evCat">';
    for(var j2=0;j2<EVENT_CATEGORIES.length;j2++) h += '<option value="'+EVENT_CATEGORIES[j2]+'">'+catLabel(EVENT_CATEGORIES[j2])+'</option>';
    h += '</select></label>';
    h += '<label class="field"><span>Date & time</span><input id="evTime" type="datetime-local" required value="'+toLocalInput(new Date(Date.now()+86400000).toISOString())+'"></label>';
    h += '<label class="field"><span>Location</span><input id="evLoc"></label>';
    h += '<label class="field"><span>Description</span><textarea id="evDesc"></textarea></label>';
    h += '<button type="submit" class="btn btn-primary">'+icon('plus')+' Publish event</button></form></div>';
    h += '<div class="card"><div class="card-h"><h2>Create announcement</h2></div>';
    h += '<form onsubmit="createAnnouncement(event)">';
    h += '<label class="field"><span>Title</span><input id="anTitle" required></label>';
    h += '<label class="field"><span>Body</span><textarea id="anBody" required></textarea></label>';
    h += '<label style="display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:14px"><input type="checkbox" id="anPinned" style="width:auto"> Pin to top</label>';
    h += '<button type="submit" class="btn btn-primary">'+icon('plus')+' Publish announcement</button></form></div>';
    h += '<div class="card"><div class="card-h"><h2>Add member</h2></div>';
    h += '<form onsubmit="addMember(event)">';
    h += '<label class="field"><span>Full name</span><input id="mName" required></label>';
    h += '<label class="field"><span>Phone</span><input id="mPhone" placeholder="07XX XXX XXX" required></label>';
    h += '<label class="field"><span>Reg. number</span><input id="mReg"></label>';
    h += '<label class="field"><span>Email</span><input id="mEmail" type="email"></label>';
    h += '<label class="field"><span>Year</span><select id="mYear">';
    for(var y2=1;y2<=6;y2++) h += '<option value="'+y2+'">Year '+y2+'</option>';
    h += '</select></label>';
    h += '<label class="field"><span>Course</span><input id="mCourse"></label>';
    h += '<label class="field"><span>Diocese</span><select id="mDiocese"><option>Bungoma</option><option>Kakamega</option><option>Kitale</option><option>Other</option></select></label>';
    h += '<label class="field"><span>Family</span><select id="mFamily">';
    for(var fi2=0;fi2<DB.families.length;fi2++) h += '<option value="'+DB.families[fi2].id+'">'+DB.families[fi2].number+'. '+esc(DB.families[fi2].name)+'</option>';
    h += '</select></label>';
    h += '<label class="field"><span>Role</span><select id="mRole">';
    for(var rk2 in ROLES) h += '<option value="'+rk2+'">'+ROLES[rk2]+'</option>';
    h += '</select></label>';
    h += '<label style="display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:14px"><input type="checkbox" id="mCatholic" checked style="width:auto"> Active Catholic</label>';
    h += '<button type="submit" class="btn btn-primary">'+icon('plus')+' Add member</button></form></div>';
  }
  if(tab==='manage'){
    h += '<div class="card"><div class="card-h"><h2>Manage events</h2></div>';
    var sortedEvents = DB.events.slice().sort(function(a,b){return new Date(b.starts_at)-new Date(a.starts_at);});
    if(sortedEvents.length===0) h += '<p class="muted">No events yet.</p>';
    for(var ei=0;ei<sortedEvents.length;ei++){
      var e2 = sortedEvents[ei];
      var dateStr = new Date(e2.starts_at).toLocaleDateString('en-KE',{year:'numeric',month:'2-digit',day:'2-digit'});
      h += '<div class="card" style="box-shadow:none;border:1px solid var(--border);padding:16px;margin-bottom:12px">';
      h += '<span class="chip">'+esc(catLabel(e2.category))+'</span>';
      h += '<h3 style="font-size:16px;font-weight:600;margin:8px 0 4px">'+esc(e2.title)+'</h3>';
      h += '<p class="muted small">'+dateStr+(e2.location?' · '+esc(e2.location):'')+'</p>';
      h += '<button class="btn btn-danger btn-sm" style="margin-top:10px" onclick="deleteEvent(\''+e2.id+'\')">'+icon('trash')+' Delete</button>';
      h += '</div>';
    }
    h += '</div>';
    h += '<div class="card"><div class="card-h"><h2>Manage announcements</h2></div>';
    if(DB.announcements.length===0) h += '<p class="muted">No announcements yet.</p>';
    for(var ai=0;ai<DB.announcements.length;ai++){
      var a3 = DB.announcements[ai];
      var dateStr2 = new Date(a3.created_at).toLocaleDateString('en-KE',{year:'numeric',month:'2-digit',day:'2-digit'});
      h += '<div class="card" style="box-shadow:none;border:1px solid var(--border);padding:16px;margin-bottom:12px">';
      h += '<h3 style="font-size:16px;font-weight:600;margin-bottom:4px">'+esc(a3.title)+'</h3>';
      h += '<p class="muted small">'+dateStr2+(a3.pinned?' · Pinned':'')+'</p>';
      h += '<button class="btn btn-danger btn-sm" style="margin-top:10px" onclick="deleteAnnouncement(\''+a3.id+'\')">'+icon('trash')+' Delete</button>';
      h += '</div>';
    }
    h += '</div>';
  }
  if(tab==='data'){
    h += '<div class="card"><div class="card-h"><h2>Backup</h2></div>';
    h += '<p class="muted mb">Copy all data as JSON. Save it somewhere safe.</p>';
    h += '<button class="btn btn-outline" onclick="copyBackup()">Copy data as JSON</button></div>';
    h += '<div class="card"><div class="card-h"><h2>Statistics</h2></div>';
    h += '<p style="padding:4px 0">Members: <b>'+DB.members.length+'</b></p>';
    h += '<p style="padding:4px 0">Events: <b>'+DB.events.length+'</b></p>';
    h += '<p style="padding:4px 0">Announcements: <b>'+DB.announcements.length+'</b></p>';
    h += '<p style="padding:4px 0">Prayer intentions: <b>'+DB.prayerIntentions.length+'</b></p>';
    h += '<p style="padding:4px 0">Total contributions: <b>'+fmtKES(DB.payments.reduce(function(s,p){return s+Number(p.amount);},0))+'</b></p>';
    h += '</div>';
    if(isSA(u)){
      h += '<div class="card" style="border:1px solid #FEE2E2"><div class="card-h"><h2 style="color:#991B1B">★ Danger zone</h2></div>';
      h += '<p class="muted mb">Wipe all data and start fresh. Only Super Admin can do this.</p>';
      h += '<button class="btn btn-danger" onclick="resetEverything()">Reset everything</button></div>';
    }
  }
  h += '<div class="access-card" style="margin-top:16px"><div class="check">'+icon('check')+'</div>';
  h += '<div><h3>Administrator access active</h3>';
  h += '<p>'+(isSA(u)?'Member · Leader · Super Administrator':'Member · Leader · Administrator')+'</p>';
  h += '<p class="small">Signed in as '+esc(u.full_name)+' · '+(ROLES[u.role]||u.role)+'</p></div></div>';
  return h;
}
function viewLogin(){
  return '<div class="card" style="max-width:440px;margin:24px auto">'+
    '<h2 style="font-size:20px;font-weight:700;margin-bottom:6px">Sign in</h2>'+
    '<p class="muted mb">Enter the phone number you registered with.</p>'+
    '<label class="field"><span>Phone number</span><input id="loginPhone" placeholder="07XX XXX XXX" type="tel" autocomplete="tel"></label>'+
    '<button class="btn btn-primary btn-block" onclick="doLogin()">Sign in</button>'+
    '<div style="background:#FDF6E3;border:1px solid #F5E6C0;border-radius:12px;padding:14px;margin-top:16px">'+
    '<p style="font-weight:600;color:var(--burgundy);font-size:13px">★ Super Admin (Vice Secretary)</p>'+
    '<p class="muted small" style="margin-top:4px">Sign in with <b>0701248814</b> for full control.</p>'+
    '</div></div>';
}
function render(){
  renderSidebar();
  var title = PAGE_TITLES[ROUTE] || 'Dashboard';
  document.getElementById('pageTitle').textContent = title;
  var html;
  switch(ROUTE){
    case 'login': html = viewLogin(); break;
    case 'members': html = viewMembers(); break;
    case 'families': html = viewFamilies(); break;
    case 'events': html = viewEvents(); break;
    case 'announcements': html = viewAnnouncements(); break;
    case 'prayer': html = viewPrayer(); break;
    case 'attendance': html = viewAttendance(); break;
    case 'contributions': html = viewContributions(); break;
    case 'leadership': html = viewLeadership(); break;
    case 'directory': html = viewDirectory(); break;
    case 'constitution': html = viewConstitution(); break;
    case 'elections': html = viewElections(); break;
    case 'admin': html = viewAdmin(); break;
    default: html = viewDashboard();
  }
  document.getElementById('app').innerHTML = html;
}
render();
</script>
