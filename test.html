<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BUKAKI Raw Test</title>
<style>
body{font-family:system-ui;padding:16px;background:#fafaf9}
.r{padding:14px;border-radius:10px;margin-bottom:10px;font-size:14px;font-weight:600}
.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.bad{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.warn{background:#fef3c7;color:#78350f;border:1px solid #fcd34d}
pre{background:#fff;padding:12px;border-radius:8px;font-size:11px;overflow-x:auto;border:1px solid #e7e5e4;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h1>BUKAKI Raw Supabase Test</h1>
<div id="r0" class="r warn">0. Initializing...</div>
<div id="r1" class="r warn">1. Raw select from bukaki_state...</div>
<div id="r2" class="r warn">2. Select with .maybeSingle()...</div>
<div id="r3" class="r warn">3. Anonymous auth test...</div>
<pre id="log">Log:</pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var log = document.getElementById('log');
function L(m){ log.textContent += '\n' + m; }

var URL = 'https://itjpfjlmyimbfbijucza.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0anBmamxteWxtYmZiaWp1Y3phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTMyOTEsImV4cCI6MjEwNjg2OTI5MX0.zzQ93QQPz6kO2ailCXx1KvRHMim0KkWMoiWx6-wXhyc';

var client = window.supabase.createClient(URL, KEY);
document.getElementById('r0').className = 'r ok';
document.getElementById('r0').textContent = '0. Client initialized';

setTimeout(async function(){
  var r = document.getElementById('r1');
  try {
    var res = await client.from('bukaki_state').select('*').limit(5);
    if (res.error) {
      r.className = 'r bad';
      r.textContent = '1. ❌ Select errored — see below';
    } else {
      r.className = 'r ok';
      r.textContent = '1. ✅ Select returned ' + (res.data ? res.data.length : 0) + ' rows';
    }
    L('=== Test 1 raw select ===');
    L('data: ' + JSON.stringify(res.data));
    L('error: ' + JSON.stringify(res.error));
    L('status: ' + res.status);
  } catch(e) {
    r.className = 'r bad';
    r.textContent = '1. ❌ Exception: ' + e.message;
    L('Test 1 exception: ' + e.message);
  }
}, 2000);

setTimeout(async function(){
  var r = document.getElementById('r2');
  try {
    var res = await client.from('bukaki_state').select('data').eq('id','main').maybeSingle();
    if (res.error) {
      r.className = 'r bad';
      r.textContent = '2. ❌ maybeSingle errored — see below';
    } else if (res.data) {
      r.className = 'r ok';
      r.textContent = '2. ✅ maybeSingle got row with ' + Object.keys(res.data.data||{}).length + ' keys';
    } else {
      r.className = 'r bad';
      r.textContent = '2. ❌ maybeSingle returned null';
    }
    L('=== Test 2 maybeSingle ===');
    L('data: ' + JSON.stringify(res.data));
    L('error: ' + JSON.stringify(res.error));
  } catch(e) {
    r.className = 'r bad';
    r.textContent = '2. ❌ Exception: ' + e.message;
    L('Test 2 exception: ' + e.message);
  }
}, 4000);

setTimeout(async function(){
  var r = document.getElementById('r3');
  try {
    var res = await client.auth.signInAnonymously();
    if (res.error) {
      r.className = 'r bad';
      r.textContent = '3. ❌ Auth failed: ' + res.error.message;
      L('=== Test 3 anonymous auth ===');
      L('error: ' + JSON.stringify(res.error));
    } else {
      r.className = 'r ok';
      r.textContent = '3. ✅ Anonymous auth works';
      L('=== Test 3 anonymous auth ===');
      L('user: ' + (res.data && res.data.user ? res.data.user.id : 'none'));
    }
  } catch(e) {
    r.className = 'r bad';
    r.textContent = '3. ❌ Exception: ' + e.message;
    L('Test 3 exception: ' + e.message);
  }
}, 6000);
</script>
</body>
</html>
