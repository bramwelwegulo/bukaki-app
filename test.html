<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Save Test</title>
<style>
body{font-family:system-ui;padding:16px}
#out{background:#f5f5f5;padding:12px;border-radius:8px;font-family:monospace;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>Cloud Save Test</h2>
<div id="out">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="sync.js"></script>
<script>
var out = document.getElementById('out');
var log = function(m){ out.innerText += '\n' + m; };
out.innerText = 'sync.js loaded: cloudSave = ' + typeof window.cloudSave;

async function run(){
  if(typeof window.cloudSave !== 'function'){
    log('FAIL: cloudSave missing');
    return;
  }
  log('Loading current cloud data...');
  var cur = await window.cloudLoad();
  if(!cur){ log('cloudLoad returned null, using empty base'); cur = {families:[], members:[], events:[], announcements:[], currentUserId:null}; }
  cur.events = cur.events || [];
  cur.events.push({
    id: 'savetest_' + Date.now(),
    title: 'Save Test ' + new Date().toLocaleTimeString(),
    category: 'other',
    starts_at: new Date().toISOString(),
    location: 'Test',
    semester: 'test'
  });
  log('Calling cloudSave with ' + cur.events.length + ' events...');
  var result = await window.cloudSave(cur);
  if(result){
    log('✅ Save returned success');
    log('Cloud now has ' + (result.events ? result.events.length : '?') + ' events');
  } else {
    log('❌ Save returned null — check browser console');
  }
}
setTimeout(run, 1000);
</script>
</body>
</html>
